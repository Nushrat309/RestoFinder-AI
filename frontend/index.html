<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoFinder AI - Your Premium Dining Guide</title>
    <meta name="description" content="An elegant AI-powered assistant that helps you discover and locate the best dining experiences around you.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area">
                <span class="logo-icon">🍽️</span>
                <div class="logo-text">
                    <h1>RestoFinder <span class="accent-text">AI</span></h1>
                    <p class="subtitle">AI Restaurant Assistant</p>
                </div>
            </div>
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">Online</span>
            </div>
        </header>

        <!-- Chat Area -->
        <main class="chat-container" id="chat-container">
            <div class="message-wrapper assistant animate-fade-in">
                <div class="avatar">🤖</div>
                <div class="message-bubble">
                    <p>Welcome! I am <strong>RestoFinder AI</strong>, your personal dining assistant. Tell me what kind of restaurant you are looking for and your location, and I will find the perfect spot for you! 🍔🍕🍣</p>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="app-footer">
            <form id="chat-form" class="chat-input-container">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Type your location or culinary cravings..." 
                    autocomplete="off"
                    required
                />
                <button type="submit" id="send-button" aria-label="Send message">
                    <svg viewBox="0 0 24 24" width="24" height="24" class="send-icon">
                        <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </form>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
